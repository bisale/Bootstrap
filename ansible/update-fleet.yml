---
# Manuell anstoßen, wann immer du willst - kein Cron, kein automatischer Trigger:
#   ansible-playbook -i inventory.ini update-fleet.yml
#
# Nutzt bewusst NUR die eingeschränkte sudo-Regel aus setup-restricted-sudo.yml.
# 'become: false', weil Ansibles eigener become-Mechanismus den Befehl in eine
# Shell verpackt (sudo sieht dann "/bin/sh -c '...'" statt des exakten Pfads) -
# das würde das strikte Command-Matching in der sudoers-Regel umgehen/brechen.
# Stattdessen wird sudo hier explizit und exakt so aufgerufen, wie es die
# sudoers-Regel erwartet.

- name: update.sh auf Proxmox-Host, allen VMs und LXCs ausführen
  hosts: fleet
  become: false
  gather_facts: false
  tasks:
    - name: update.sh ausführen (restricted sudo, --yes non-interaktiv)
      ansible.builtin.command:
        cmd: sudo -n /usr/local/bin/update.sh --yes
      register: update_result
      changed_when: true

    - name: Ausgabe anzeigen
      ansible.builtin.debug:
        var: update_result.stdout_lines

    - name: Reboot-Hinweis
      ansible.builtin.debug:
        msg: "⚠ {{ inventory_hostname }}: Reboot erforderlich!"
      when: "'REBOOT ERFORDERLICH' in update_result.stdout"
