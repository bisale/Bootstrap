# IPs/Hostnamen an eure Umgebung anpassen.
# Verbindungs-User ist bewusst NICHT root und hat KEIN breites sudo -
# nur die eine Ausnahme aus files/ansible-update-sudoers.

[proxmox]
pve1 ansible_host=192.168.1.10

[lxc]
lxc-101 ansible_host=192.168.1.101
lxc-102 ansible_host=192.168.1.102

[vm]
vm-201 ansible_host=192.168.1.201

[fleet:children]
proxmox
lxc
vm

[fleet:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/id_ansible
